# Local development infrastructure. These credentials are for local development only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: footballhub
      POSTGRES_USER: footballhub
      POSTGRES_PASSWORD: footballhub_dev
    ports:
      - "5432:5432"
    volumes:
      - footballhub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footballhub -d footballhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  footballhub_data:
