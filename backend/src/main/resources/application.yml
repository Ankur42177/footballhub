spring:
  application:
    name: footballhub-api
  datasource:
    # Must be a JDBC URL, e.g. jdbc:postgresql://host:5432/db?sslmode=require
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/footballhub}
    username: ${DATABASE_USERNAME:footballhub}
    password: ${DATABASE_PASSWORD:footballhub_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 7d
    jdbc:
      # Flyway owns the session tables (V3__spring_session.sql).
      initialize-schema: never
      cleanup-cron: "0 */10 * * * *"
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # Jackson 3 rejects missing primitive fields by default; treat them as false/0
      # so optional flags like "publish" can be left out of request bodies.
      fail-on-null-for-primitives: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
        max-age: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Comma-separated. Accounts registered with these emails become administrators.
  admin-emails: ${ADMIN_EMAILS:}
  require-verified-email-to-publish: ${REQUIRE_VERIFIED_EMAIL:false}
  seed-demo-data: ${SEED_DEMO_DATA:false}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    writes-per-minute: ${RATE_LIMIT_WRITES_PER_MINUTE:60}

logging:
  level:
    com.footballhub: INFO
